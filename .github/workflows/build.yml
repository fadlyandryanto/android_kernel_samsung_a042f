name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional notes for this build'
        required: false
        default: ''

permissions:
  contents: write

# Cancel any in-progress run for the same ref when a new one is dispatched.
concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [stock, bakasu]

    steps:
      # Shallow clone: build job needs no history.
      # Pin to github.sha so both variants and the release job agree on the commit.
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      # Compute metadata once. Both variants compute the same values,
      # but only `stock` publishes the meta artifact (avoids merge collisions).
      - name: Compute metadata
        id: meta
        run: |
          mkdir -p meta
          make -s kernelversion > meta/version.txt
          git rev-parse --short=7 HEAD > meta/short_sha.txt

          # Deepen just enough for a 20-commit changelog. Only on stock.
          if [ "${{ matrix.variant }}" = "stock" ]; then
            git fetch --depth=50 origin "${{ github.ref_name }}"
            git log --no-merges -20 FETCH_HEAD \
              --pretty=format:"- [\`%h\`](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" \
              > meta/recent.txt
          fi

          echo "version=$(cat meta/version.txt)"     >> "$GITHUB_OUTPUT"
          echo "short_sha=$(cat meta/short_sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload metadata
        if: matrix.variant == 'stock'
        uses: actions/upload-artifact@v4
        with:
          name: meta
          path: meta/
          retention-days: 30
          if-no-files-found: error

      - name: Apply BakaSU + SusFS patches
        if: matrix.variant == 'bakasu'
        run: |
          git config user.name  "CI"
          git config user.email "ci@localhost"
          git am patches/bakasu/*.patch
          git submodule update --init --recursive
          echo "----- submodule status -----"
          git submodule status

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            device-tree-compiler zip unzip cpio rsync \
            python3 python3-pip git build-essential \
            binutils-aarch64-linux-gnu

      - name: Cache clang-r383902 toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang-r383902
          key: clang-r383902-v1

      - name: Download clang-r383902
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/clang-r383902
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz -O /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C ~/clang-r383902
          chmod +x ~/clang-r383902/bin/*
          ~/clang-r383902/bin/clang --version

      - name: Configure kernel (a04e_defconfig)
        run: |
          make -C "$(pwd)" O="$(pwd)/out" ARCH=arm64 \
               CC=$HOME/clang-r383902/bin/clang \
               CROSS_COMPILE=/usr/bin/aarch64-linux-gnu- \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
               a04e_defconfig

      - name: Build kernel
        run: |
          make -C "$(pwd)" O="$(pwd)/out" ARCH=arm64 \
               CC=$HOME/clang-r383902/bin/clang \
               CROSS_COMPILE=/usr/bin/aarch64-linux-gnu- \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
               -j"$(nproc)"

      - name: Verify kernel image
        run: ls -la out/arch/arm64/boot/Image.gz

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/fadlyandryanto/AnyKernel3.git ak3

      - name: Pack kernel
        id: pack
        run: |
          cp out/arch/arm64/boot/Image.gz ak3/Image.gz

          ZIP_NAME="AnyKernel3-a04e-${{ matrix.variant }}-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}.zip"

          cd ak3
          zip -r9 "../${ZIP_NAME}" . \
              -x ".git/*" -x ".github/*" -x "README.md" -x ".gitignore"
          cd ..

          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          ls -la "${ZIP_NAME}"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.variant }}
          path: ${{ steps.pack.outputs.zip_name }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      # No checkout: everything we need (version, sha, changelog, zips) comes
      # from artifacts produced by the build job.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Load metadata
        id: meta
        run: |
          echo "version=$(cat artifacts/version.txt)"     >> "$GITHUB_OUTPUT"
          echo "short_sha=$(cat artifacts/short_sha.txt)" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: find artifacts -maxdepth 1 -type f -printf '%10s  %p\n'

      - name: Generate release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          FULL_SHA: ${{ github.sha }}
          USER_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          {
            echo "**Manually triggered kernel build for Samsung Galaxy A04e (MT6765)**"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Kernel** | \`${VERSION}\` |"
            echo "| **Commit** | [\`${SHORT_SHA}\`](https://github.com/${REPO}/commit/${FULL_SHA}) |"
            echo "| **Build**  | #${RUN_NUMBER}, dispatched by @${ACTOR} |"
            echo ""
            echo "### Variants included in this release"
            echo ""
            echo "| Variant | File | Description |"
            echo "|---|---|---|"
            echo "| **stock**  | \`AnyKernel3-a04e-stock-${VERSION}-${SHORT_SHA}.zip\`  | Plain a04e kernel, no root |"
            echo "| **bakasu** | \`AnyKernel3-a04e-bakasu-${VERSION}-${SHORT_SHA}.zip\` | BakaSU + SusFS v2.3.0 |"
            echo ""
          } > RELEASE_NOTES.md

          if [ -n "${USER_NOTES}" ]; then
            {
              echo "### Build notes from dispatcher"
              echo ""
              echo "${USER_NOTES}"
              echo ""
            } >> RELEASE_NOTES.md
          fi

          {
            echo "### Recent commits (last 20)"
            echo ""
            cat artifacts/recent.txt
            echo ""
            echo ""
            echo "[Full commit history on \`a04e\`](https://github.com/${REPO}/commits/a04e)"
            echo ""
            echo "---"
            echo ""
            echo "**Flash via AnyKernel3** — flash the zip matching your variant in a"
            echo "custom recovery (TWRP / OrangeFox) on top of your existing boot image."
            echo ""
            echo "**Toolchain:** clang-r383902 + binutils-aarch64-linux-gnu"
          } >> RELEASE_NOTES.md

          echo "----- RELEASE NOTES -----"
          cat RELEASE_NOTES.md

      - name: Delete existing release
        run: |
          gh release delete "a04e-latest" --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: a04e-latest
          name: "a04e — ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.short_sha }})"
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: artifacts/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
