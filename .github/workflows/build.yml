name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional notes for this build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            device-tree-compiler zip unzip cpio rsync \
            python3 python3-pip git build-essential \
            binutils-aarch64-linux-gnu

      - name: Cache clang-r383902 toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang-r383902
          key: clang-r383902-v1

      - name: Download clang-r383902
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/clang-r383902
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz -O /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C ~/clang-r383902
          chmod +x ~/clang-r383902/bin/*
          ~/clang-r383902/bin/clang --version

      - name: Verify toolchain
        run: |
          ~/clang-r383902/bin/clang --version
          /usr/bin/aarch64-linux-gnu-as --version | head -1
          /usr/bin/aarch64-linux-gnu-ld --version | head -1

      - name: Configure kernel (a04e_defconfig)
        run: |
          make -C $(pwd) O=$(pwd)/out ARCH=arm64 \
               CC=$HOME/clang-r383902/bin/clang \
               CROSS_COMPILE=/usr/bin/aarch64-linux-gnu- \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
               a04e_defconfig

      - name: Build kernel
        run: |
          make -C $(pwd) O=$(pwd)/out ARCH=arm64 \
               CC=$HOME/clang-r383902/bin/clang \
               CROSS_COMPILE=/usr/bin/aarch64-linux-gnu- \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
               -j$(nproc)

      - name: Verify kernel image
        run: |
          ls -la out/arch/arm64/boot/Image.gz

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/fadlyandryanto/AnyKernel3.git ak3
          ls -la ak3/

      - name: Pack kernel into AnyKernel3
        run: |
          set -e

          # Only the kernel image — no modules, no DTBs
          cp out/arch/arm64/boot/Image.gz ak3/Image.gz

          cd ak3
          zip -r9 ../AnyKernel3-a04e.zip . \
              -x ".git/*" \
              -x ".github/*" \
              -x "README.md" \
              -x ".gitignore"

          cd ..
          ls -la AnyKernel3-a04e.zip

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-a04e-${{ github.run_number }}
          path: |
            AnyKernel3-a04e.zip
            out/arch/arm64/boot/Image.gz
          retention-days: 30

      - name: Delete existing continuous release
        run: |
          gh release delete continuous --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: "Continuous Build"
          body: |
            **Auto-built kernel for Samsung Galaxy A04e (a04e / MT6765)**

            - Commit: `${{ github.sha }}`
            - Triggered by: @${{ github.actor }}
            - Run: #${{ github.run_number }}

            ${{ github.event.inputs.release_notes }}

            **Flash via AnyKernel3** — flash `AnyKernel3-a04e.zip` in a custom recovery
            (TWRP/OrangeFox) on top of your existing LineageOS boot image.

            **Toolchain:** clang-r383902 + binutils-aarch64-linux-gnu

            **Note:** Kernel image only. Modules are not packaged —
            this kernel is intended for custom ROMs where everything
            needed is either built-in or shipped with the ROM.
          prerelease: true
          files: AnyKernel3-a04e.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
